name: SentinelPR
description: Enterprise Java Security & PR Review Copilot powered by Shree AI OS

branding:
  icon: shield
  color: blue

inputs:
  github_token:
    description: GitHub token for PR comments
    required: true

  gemini_api_key:
    description: Gemini BYOK API key
    required: false

  fail_on_critical:
    description: Fail workflow on CRITICAL findings
    required: false
    default: "true"

  format:
    description: Output format
    required: false
    default: github

  version:
    description: SentinelPR release version
    required: false
    default: "1.2.0"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    - name: Download SentinelPR
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        if ! curl -s -f -L "https://github.com/darshanrathod04/sentinel-pr/releases/download/v${VERSION}/sentinel-pr-${VERSION}.jar" -o sentinel-pr.jar; then
          echo "Release v${VERSION} not found; falling back to v1.1.4"
          curl -s -f -L "https://github.com/darshanrathod04/sentinel-pr/releases/download/v1.1.4/sentinel-pr-1.1.4.jar" -o sentinel-pr.jar
        fi

    - name: Extract Pull Request Diff
      id: diff-prep
      shell: bash
      env:
        PR_NUMBER: "${{ github.event.pull_request.number }}"
        BASE_SHA: "${{ github.event.pull_request.base.sha }}"
        HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        GITHUB_TOKEN: "${{ inputs.github_token }}"
        REPO: "${{ github.repository }}"
      run: |
        DIFF_ARG=""
        if [ -n "$PR_NUMBER" ]; then
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "::error::Pull request event missing base or head SHA. Cannot determine PR boundary safely."
            exit 1
          fi

          echo "Generating PR diff between base $BASE_SHA and head $HEAD_SHA..."
          # Attempt git fetch for base and head refs if missing locally
          git fetch --no-tags --depth=100 origin "$BASE_SHA" 2>/dev/null || true
          git fetch --no-tags --depth=100 origin "$HEAD_SHA" 2>/dev/null || true

          if git diff "$BASE_SHA"..."$HEAD_SHA" > /tmp/sentinel-pr.diff 2>/dev/null && [ -s /tmp/sentinel-pr.diff ]; then
            echo "Captured git diff via three-dot merge-base range."
            DIFF_ARG="--diff /tmp/sentinel-pr.diff"
          elif git diff "$BASE_SHA" "$HEAD_SHA" > /tmp/sentinel-pr.diff 2>/dev/null && [ -s /tmp/sentinel-pr.diff ]; then
            echo "Captured git diff via two-dot range."
            DIFF_ARG="--diff /tmp/sentinel-pr.diff"
          else
            echo "Local git range unavailable; attempting GitHub API diff download..."
            curl -s -f -L -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3.diff" \
              "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER" \
              -o /tmp/sentinel-pr.diff 2>/dev/null || true

            if [ -s /tmp/sentinel-pr.diff ]; then
              echo "Successfully captured PR diff from GitHub API."
              DIFF_ARG="--diff /tmp/sentinel-pr.diff"
            else
              echo "::error::Could not acquire PR diff for PR #$PR_NUMBER. Refusing to fall back to uncontained full scan on pull request."
              exit 1
            fi
          fi
        fi
        echo "diff_arg=$DIFF_ARG" >> $GITHUB_OUTPUT

    - name: Run SentinelPR
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
      run: |
        java -Dloader.main=com.sentinelpr.cli.SentinelCliRunner \
          -cp sentinel-pr.jar org.springframework.boot.loader.launch.PropertiesLauncher \
          --target . \
          --repo ${{ github.repository }} \
          --pr ${{ github.event.pull_request.number }} \
          ${{ steps.diff-prep.outputs.diff_arg }} \
          --post-comment \
          -f ${{ inputs.format }}
